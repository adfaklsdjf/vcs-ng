[project]
name = "vcs-ng"
version = "1.0.6"
description = "Video contact sheet generator — a modern rewrite of Video Contact Sheet *NIX"
readme = "README.md"
requires-python = ">=3.11"
license = "LGPL-2.1-or-later"
dependencies = ["pillow>=10.0"]

[project.scripts]
vcsng = "vcsng.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vcsng"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ffmpeg: tests that require ffmpeg/ffprobe on PATH"]
