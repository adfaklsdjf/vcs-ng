[project]
name = "vcs-ng"
dynamic = ["version"]
description = "Video contact sheet generator — a modern rewrite of Video Contact Sheet *NIX"
readme = "README.md"
requires-python = ">=3.11"
license = "LGPL-2.1-or-later"
dependencies = ["pillow>=10.0"]

[project.scripts]
vcsng = "vcsng.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"  # version comes from the nearest vX.Y.Z git tag
fallback-version = "0+unknown"  # building from a tree without git history

[tool.uv]
# uv caches builds of local projects keyed on these. Include the git commit and
# tags (the version changes with them) and the sources (so `uv tool install .`
# picks up uncommitted edits too).
cache-keys = [
    { file = "pyproject.toml" },
    { file = "src/**/*" },
    { git = { commit = true, tags = true } },
]

[tool.hatch.build.targets.wheel]
packages = ["src/vcsng"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ffmpeg: tests that require ffmpeg/ffprobe on PATH"]
