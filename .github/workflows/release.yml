name: release

# On every push to main (i.e. a merged PR), run the tests; if they pass and the
# version in pyproject.toml has no matching git tag yet, tag it and cut a GitHub
# release with auto-generated notes. Bump the version in pyproject.toml (in your
# PR) to trigger a release; leave it unchanged for no-op merges.

on:
  push:
    branches: [main]

permissions:
  contents: write  # needed to push the tag and create the release

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.11
      - name: Sync dependencies
        run: uv sync
      - name: Run tests
        run: uv run pytest -q

  release:
    needs: test  # release only runs if the test job succeeded
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need all tags to check whether this version exists

      - name: Read version from pyproject.toml
        id: version
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Project version: $version"

      - name: Check whether this version is already released
        id: check
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists; skipping release."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $tag is new; will release."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag and GitHub release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          git tag "$tag"
          git push origin "$tag"
          gh release create "$tag" \
            --title "$tag" \
            --generate-notes
