name: release

# Every push to main (direct push or PR merge) runs the tests and, if they pass,
# tags and publishes a release; nothing needs to be bumped by hand. The version
# is chosen by .github/scripts/release_plan.py: a `feat:` commit since the last
# tag means a minor bump, anything else a patch.
#
# To choose a version yourself, tag the commit and push the tag with it:
#   git tag v2.0.0 && git push origin main v2.0.0
# The planner sees the tag on HEAD and publishes it as-is.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release  # one at a time, so two runs can't pick the same version
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write  # push the tag and create the release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # all history and tags

      - name: Plan release
        id: plan
        run: python3 .github/scripts/release_plan.py --notes "$RUNNER_TEMP/notes.md"

      - name: Push tag
        if: steps.plan.outputs.create_tag == 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
